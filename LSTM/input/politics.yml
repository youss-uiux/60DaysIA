- - qu'est-ce qu'un gouvernement
  - idéalement c'est un représentant du peuple.
- - qu'est-ce que greenpeace
  - organisation mondiale promouvant l'activisme environnemental.
- - qu'est-ce que le capitalisme
  - le système économique dans lequel tous ou la plupart des moyens de production et de distribution,
    comme la terre, les usines, les chemins de fer, etc., sont possédés et exploités privément pour le profit,
    à l'origine sous des conditions entièrement compétitives.
- - qu'est-ce que le socialisme
  - communisme de gens qui veulent garder leurs volvos. n'importe laquelle de diverses théories ou
    systèmes de propriété et d'exploitation des moyens de production et de distribution
    par la société ou la communauté plutôt que par des individus privés, avec tous les membres
    de la société ou de la communauté partageant le travail et les produits.
- - qu'est-ce que le gouvernement
  - un système établi d'administration politique par lequel une nation, un état, un district,
    etc. est gouverné.
- - qu'est-ce que le communisme
  - un mouvement sociopolitique prônant la propriété commune des moyens de production
    et la résolution du conflit de classe en instaurant une société sans classes.
- - qu'est-ce qu'être destitué
  - quand l'honneur ou la réputation d'une personne a été contesté ou discrédité.
